<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building a form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>User Poll</header>
    <main>
        <form action="to get user input">
            <label for="fullname">Full Name:</label>
            <input type="text" name="fullname" id="fullname" required>
            <label for="useremail">Email Address</label>
            <input type="email" id="useremail" name="useremail" required>

        </form>
        <label for="browser">What is your favorite browser?</label>
        <select name="browser" id="browser">
            <value="chrome>Chrome</option>
                <option value="chrome">Chrome</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">other</option>
        </select>
        <label for="pet" id="Do you have a household pet?"></label>
        <input type="checkbox" id="pet" name="pet">
        <label for="feedback">List the places you have lived.</label>
        <textarea name="feedback" id="feedback" rows="4"
          placeholder="Johannesburg, Cape Town, Mpumalanga, Netherlads"></textarea>
        <button type="submit">Submit Poll</button>
    </main>
</body>

</html>
